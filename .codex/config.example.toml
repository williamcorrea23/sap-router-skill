[shell_environment_policy]
inherit = "core"
# Run python scripts/sync_codex_config.py --apply to resolve absolute paths and existing global aliases.
# Commands below assume cwd is SAP_ROUTER_ROOT. Package installs never happen during launch.
[shell_environment_policy]
inherit = "core"

[mcp_servers."arc-1"]
command = "python"
args = ["scripts/mcp_launcher.py", "run", "--server", "arc-1"]
startup_timeout_sec = 30

[mcp_servers."aibap"]
command = "python"
args = ["scripts/mcp_launcher.py", "run", "--server", "aibap"]
startup_timeout_sec = 30

[mcp_servers."mcp-sap-gui"]
command = "python"
args = ["scripts/mcp_launcher.py", "run", "--server", "mcp-sap-gui"]
startup_timeout_sec = 30

[mcp_servers."sap-cpi-mcp"]
command = "python"
args = ["scripts/mcp_launcher.py", "run", "--server", "sap-cpi-mcp"]
startup_timeout_sec = 30

[mcp_servers."sap-apim-mcp"]
command = "python"
args = ["scripts/mcp_launcher.py", "run", "--server", "sap-apim-mcp"]
startup_timeout_sec = 30

[mcp_servers."integration-suite-ui-mcp"]
command = "python"
args = ["scripts/mcp_launcher.py", "run", "--server", "integration-suite-ui-mcp"]
startup_timeout_sec = 30

[mcp_servers."apim-ui-mcp"]
command = "python"
args = ["scripts/mcp_launcher.py", "run", "--server", "apim-ui-mcp"]
startup_timeout_sec = 30

[mcp_servers."ui5-mcp"]
command = "python"
args = ["scripts/mcp_launcher.py", "run", "--server", "ui5-mcp"]
startup_timeout_sec = 30

[mcp_servers."fiori-mcp"]
command = "python"
args = ["scripts/mcp_launcher.py", "run", "--server", "fiori-mcp"]
startup_timeout_sec = 30

[mcp_servers."cap-mcp"]
command = "python"
args = ["scripts/mcp_launcher.py", "run", "--server", "cap-mcp"]
startup_timeout_sec = 30

[mcp_servers."context-mode"]
command = "python"
args = ["scripts/mcp_launcher.py", "run", "--server", "context-mode"]
startup_timeout_sec = 30
[mcp_servers.arc-1]
command = "npx"
args = ["arc-1"]
env_vars = ["ARC_SAP_URL", "ARC_SAP_USER", "ARC_SAP_PASSWORD", "ARC_SAP_CLIENT"]

[mcp_servers.mcp-sap-gui]
command = "python"
args = ["-m", "sap_gui_server.server"]
env_vars = ["SAP_SYSTEM", "SAP_CLIENT", "SAP_USER", "SAP_PASSWORD", "SAPGUI_HOST", "SAPGUI_USER", "SAPGUI_PASSWORD", "SAPGUI_CLIENT", "PYTHONPATH"]

[mcp_servers.ci-mcp-server]
command = "node"
args = ["packages/ci-mcp-server/node_modules/odata-mcp-proxy/dist/index.js", "--config", "packages/ci-mcp-server/ci-api-config.json"]
env_vars = ["CPI_DESTINATION_BASE_URL", "CPI_DESTINATION_TOKEN_URL", "CPI_DESTINATION_CLIENT_ID", "CPI_DESTINATION_CLIENT_SECRET"]

[mcp_servers.sap-api-management]
command = "node"
args = ["dist/index.js"]
env_vars = ["APIM_HOST", "APIM_USER", "APIM_PASSWORD"]

[mcp_servers.integration-suite-ui-mcp]
command = "node"
args = ["scripts/web_ui_mcp_bridge.mjs", "--product", "cpi"]
env_vars = ["CPI_WEB_URL", "BROWSER_CHANNEL"]

[mcp_servers.apim-ui-mcp]
command = "node"
args = ["scripts/web_ui_mcp_bridge.mjs", "--product", "apim"]
env_vars = ["APIM_WEB_URL", "BROWSER_CHANNEL"]
